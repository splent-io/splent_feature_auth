[build-system]
requires = ["setuptools>=80.3.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splent_feature_auth"
version = "1.10.0"
requires-python = ">=3.13"
authors = [{ name = "DiversoLab", email = "diversolab@us.es" }]
dependencies = [
    "email_validator",
    # role_required lives in the framework, so an older one breaks this
    # feature at import time rather than at first use.
    "splent_framework>=1.8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]

# ── Feature Contract (auto-generated) ────────────────────────────────────────
# Do not edit manually — re-run `splent feature:contract --write` to refresh.
# Preserved across refreshes: description, category, tags, env,
# requires.features_manual (dependencies invisible to static analysis)
# and provides.routes_manual (routes built from configuration at
# registration time, which have no literal path to find in source).
[tool.splent.contract]
description = "Authentication with registration, login, logout and session management"
archetype = "full"

[tool.splent.contract.provides]
routes     = ["/login", "/logout"]
blueprints = []
models     = ["User"]
commands   = ["create-user", "list-users", "set-password", "set-role"]
hooks      = ["layout.anonymous_sidebar", "layout.authenticated_sidebar", "layout.nav.end", "layout.navbar.anonymous", "layout.navbar.authenticated", "layout.scripts"]
services   = ["AuthenticationService"]
signals    = ["user-registered"]
translations = ["es"]
docker     = []

[tool.splent.contract.requires]
features = []
env_vars = ["AUTH_LOGIN_LAYOUT", "AUTH_MIGRATION_LEGACY_ROLE", "AUTH_NAV_LOGIN"]
signals  = []

[tool.splent.contract.extensible]
services  = ["AuthenticationService"]
templates = ["auth/login_form.html", "hooks/anonymous_sidebar_items.html", "hooks/authenticated_sidebar_items.html", "hooks/navbar_anonymous.html", "hooks/navbar_authenticated.html", "hooks/public_nav.html"]
models    = ["User"]
hooks     = ["auth.login.form_footer", "layout.anonymous_sidebar", "layout.authenticated_sidebar", "layout.nav.end", "layout.navbar.anonymous", "layout.navbar.authenticated", "layout.scripts"]
routes    = false
